<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>J.A.R.V.I.S</title>
  <style>
    * { box-sizing: border-box; margin: 0; padding: 0; }
    body {
      background: #000;
      display: flex;
      align-items: center;
      justify-content: center;
      min-height: 100vh;
      font-family: 'Courier New', monospace;
    }
    #jarvis-wrap {
      background: #000;
      width: 520px;
      padding: 20px;
      display: flex;
      flex-direction: column;
      align-items: center;
      gap: 16px;
    }
    canvas { display: block; }
    #hud-top {
      width: 100%;
      display: flex;
      justify-content: space-between;
      font-size: 11px;
      color: #004488;
      letter-spacing: 2px;
      text-transform: uppercase;
    }
    #hud-top span { color: #0077cc; }
    #status-bar {
      font-size: 13px;
      color: #0af;
      letter-spacing: 4px;
      text-transform: uppercase;
      text-align: center;
    }
    #controls {
      display: flex;
      gap: 8px;
      flex-wrap: wrap;
      justify-content: center;
    }
    .ctrl-btn {
      background: transparent;
      border: 1px solid #0055aa;
      color: #0099dd;
      font-family: 'Courier New', monospace;
      font-size: 11px;
      letter-spacing: 2px;
      padding: 6px 14px;
      cursor: pointer;
      text-transform: uppercase;
      transition: all 0.2s;
    }
    .ctrl-btn:hover { background: #001133; border-color: #0af; color: #0af; }
    .ctrl-btn.active { background: #001a33; border-color: #0af; color: #0af; }
    #waveform-canvas { width: 480px; }
  </style>
</head>
<body>
<div id="jarvis-wrap">
  <div id="hud-top">
    <span id="hud-l">SYS: ONLINE</span>
    <span>J.A.R.V.I.S v4.1</span>
    <span id="hud-r">PWR: 100%</span>
  </div>
  <canvas id="main-canvas" width="400" height="400"></canvas>
  <canvas id="waveform-canvas" width="480" height="60"></canvas>
  <div id="status-bar">STANDING BY</div>
  <div id="controls">
    <button class="ctrl-btn" onclick="setState('idle')">Idle</button>
    <button class="ctrl-btn" onclick="setState('listening')">Listen</button>
    <button class="ctrl-btn" onclick="setState('speaking')">Speak</button>
    <button class="ctrl-btn" onclick="setState('processing')">Process</button>
    <button class="ctrl-btn" onclick="setState('alert')">Alert</button>
  </div>
</div>
<script>
const canvas = document.getElementById('main-canvas');
const ctx = canvas.getContext('2d');
const wCanvas = document.getElementById('waveform-canvas');
const wCtx = wCanvas.getContext('2d');
const W = 400, H = 400, CX = 200, CY = 200;
let state = 'idle';
let t = 0;
let particles = [];
let waveData = [];
const WAVE_LEN = 120;
for (let i = 0; i < WAVE_LEN; i++) waveData.push(0);
const STATES = {
  idle:       { label: 'STANDING BY',   r: 0.0,  g: 0.53, b: 1.0  },
  listening:  { label: 'LISTENING...',  r: 0.0,  g: 1.0,  b: 0.8  },
  speaking:   { label: 'SPEAKING...',   r: 0.0,  g: 0.87, b: 1.0  },
  processing: { label: 'PROCESSING...', r: 1.0,  g: 0.67, b: 0.0  },
  alert:      { label: 'ALERT!',        r: 1.0,  g: 0.2,  b: 0.2  },
};
function getColor(alpha) {
  const s = STATES[state];
  return `rgba(${Math.round(s.r*255)},${Math.round(s.g*255)},${Math.round(s.b*255)},${alpha})`;
}
function setState(s) {
  state = s;
  document.getElementById('status-bar').textContent = STATES[s].label;
  document.querySelectorAll('.ctrl-btn').forEach(b => b.classList.remove('active'));
  const names = ['idle','listening','speaking','processing','alert'];
  const btns = document.querySelectorAll('.ctrl-btn');
  const idx = names.indexOf(s);
  if (idx >= 0) btns[idx].classList.add('active');
}
function spawnParticle() {
  const angle = Math.random() * Math.PI * 2;
  const r = 90 + Math.random() * 30;
  particles.push({
    x: CX + Math.cos(angle) * r,
    y: CY + Math.sin(angle) * r,
    vx: (Math.random() - 0.5) * 1.2,
    vy: (Math.random() - 0.5) * 1.2,
    life: 1.0,
    decay: 0.008 + Math.random() * 0.015,
    size: 1 + Math.random() * 2,
  });
}
function drawHexGrid() {
  const hex_r = 14, cols = 6, rows = 6;
  ctx.save();
  ctx.globalAlpha = 0.07;
  ctx.strokeStyle = getColor(1);
  ctx.lineWidth = 0.5;
  for (let row = -rows; row <= rows; row++) {
    for (let col = -cols; col <= cols; col++) {
      const ox = col * hex_r * 1.73 + (row % 2) * hex_r * 0.87;
      const oy = row * hex_r * 1.5;
      const x = CX + ox, y = CY + oy;
      const dist = Math.sqrt(ox*ox + oy*oy);
      if (dist > 170) continue;
      ctx.beginPath();
      for (let i = 0; i < 6; i++) {
        const a = Math.PI / 180 * (60 * i - 30);
        const px = x + hex_r * Math.cos(a);
        const py = y + hex_r * Math.sin(a);
        i === 0 ? ctx.moveTo(px, py) : ctx.lineTo(px, py);
      }
      ctx.closePath();
      ctx.stroke();
    }
  }
  ctx.restore();
}
function drawRing(radius, width, speed, segments, dashOn, dashOff, alpha, reverse) {
  const angle = (t * speed * (reverse ? -1 : 1)) % (Math.PI * 2);
  ctx.save();
  ctx.translate(CX, CY);
  ctx.rotate(angle);
  ctx.lineWidth = width;
  ctx.strokeStyle = getColor(alpha);
  ctx.setLineDash([dashOn, dashOff]);
  ctx.beginPath();
  ctx.arc(0, 0, radius, 0, Math.PI * 2);
  ctx.stroke();
  ctx.setLineDash([]);
  for (let i = 0; i < segments; i++) {
    const a = (Math.PI * 2 / segments) * i;
    const ir = radius - width * 1.5;
    const or = radius + width * 1.5;
    ctx.beginPath();
    ctx.moveTo(Math.cos(a) * ir, Math.sin(a) * ir);
    ctx.lineTo(Math.cos(a) * or, Math.sin(a) * or);
    ctx.lineWidth = 1;
    ctx.strokeStyle = getColor(0.8);
    ctx.stroke();
  }
  ctx.restore();
}
function drawCore() {
  const pulse = 0.5 + 0.5 * Math.sin(t * 2.5);
  const speaking = state === 'speaking';
  const processing = state === 'processing';
  const coreR = 42 + (speaking ? pulse * 12 : 0);
  for (let i = 6; i > 0; i--) {
    const gr = coreR + i * 14;
    const ga = (0.04 - i * 0.005) * (0.7 + pulse * 0.3);
    const grd = ctx.createRadialGradient(CX, CY, coreR * 0.3, CX, CY, gr);
    grd.addColorStop(0, getColor(ga * 2));
    grd.addColorStop(1, getColor(0));
    ctx.fillStyle = grd;
    ctx.beginPath();
    ctx.arc(CX, CY, gr, 0, Math.PI * 2);
    ctx.fill();
  }
  const coreGrd = ctx.createRadialGradient(CX, CY, 0, CX, CY, coreR);
  coreGrd.addColorStop(0, getColor(0.15));
  coreGrd.addColorStop(0.5, getColor(0.05));
  coreGrd.addColorStop(1, getColor(0.3));
  ctx.fillStyle = coreGrd;
  ctx.beginPath();
  ctx.arc(CX, CY, coreR, 0, Math.PI * 2);
  ctx.fill();
  ctx.strokeStyle = getColor(0.9);
  ctx.lineWidth = 1.5;
  ctx.beginPath();
  ctx.arc(CX, CY, coreR, 0, Math.PI * 2);
  ctx.stroke();
  ctx.strokeStyle = getColor(0.6);
  ctx.lineWidth = 1;
  ctx.beginPath(); ctx.arc(CX, CY, 10, 0, Math.PI * 2); ctx.stroke();
  ctx.beginPath(); ctx.moveTo(CX, CY - 14); ctx.lineTo(CX, CY + 14); ctx.stroke();
  ctx.beginPath(); ctx.moveTo(CX - 14, CY); ctx.lineTo(CX + 14, CY); ctx.stroke();
  if (processing) {
    for (let i = 0; i < 3; i++) {
      const a = t * 3 + i * Math.PI * 2 / 3;
      const x1 = CX + Math.cos(a) * 18, y1 = CY + Math.sin(a) * 18;
      const x2 = CX + Math.cos(a) * 38, y2 = CY + Math.sin(a) * 38;
      ctx.strokeStyle = getColor(0.7 + 0.3 * Math.sin(t * 5 + i));
      ctx.lineWidth = 2;
      ctx.beginPath(); ctx.moveTo(x1, y1); ctx.lineTo(x2, y2); ctx.stroke();
    }
  }
}
function drawScanLine() {
  if (state === 'listening' || state === 'processing') {
    const scanY = CY + Math.sin(t * 1.2) * 75;
    const grad = ctx.createLinearGradient(CX - 160, scanY, CX + 160, scanY);
    grad.addColorStop(0, getColor(0));
    grad.addColorStop(0.4, getColor(0.15));
    grad.addColorStop(0.5, getColor(0.35));
    grad.addColorStop(0.6, getColor(0.15));
    grad.addColorStop(1, getColor(0));
    ctx.fillStyle = grad;
    ctx.fillRect(CX - 160, scanY - 1, 320, 2);
  }
}
function drawArcData() {
  const dataR = 168;
  const n = 36;
  for (let i = 0; i < n; i++) {
    const a = (Math.PI * 2 / n) * i + t * 0.3;
    const h = 4 + Math.random() * 8 * (0.5 + 0.5 * Math.sin(t + i));
    const brightness = 0.3 + 0.5 * Math.sin(t * 2 + i * 0.4);
    ctx.strokeStyle = getColor(brightness);
    ctx.lineWidth = 1.5;
    ctx.beginPath();
    ctx.moveTo(CX + Math.cos(a) * (dataR - h), CY + Math.sin(a) * (dataR - h));
    ctx.lineTo(CX + Math.cos(a) * dataR, CY + Math.sin(a) * dataR);
    ctx.stroke();
  }
}
function drawCornerHUD() {
  const corners = [
    [40, 40, 1, 1], [360, 40, -1, 1], [40, 360, 1, -1], [360, 360, -1, -1]
  ];
  ctx.strokeStyle = getColor(0.4);
  ctx.lineWidth = 1.5;
  for (const [x, y, dx, dy] of corners) {
    ctx.beginPath();
    ctx.moveTo(x, y + dy * 16);
    ctx.lineTo(x, y);
    ctx.lineTo(x + dx * 16, y);
    ctx.stroke();
  }
  ctx.fillStyle = getColor(0.6);
  for (const [x, y] of corners) {
    ctx.beginPath(); ctx.arc(x, y, 2, 0, Math.PI * 2); ctx.fill();
  }
}
function drawParticles() {
  const rate = state === 'speaking' ? 4 : state === 'processing' ? 3 : state === 'alert' ? 5 : 1;
  if (Math.random() < 0.3 * rate) spawnParticle();
  particles = particles.filter(p => p.life > 0);
  for (const p of particles) {
    p.x += p.vx; p.y += p.vy;
    p.life -= p.decay;
    ctx.fillStyle = getColor(p.life * 0.7);
    ctx.beginPath();
    ctx.arc(p.x, p.y, p.size, 0, Math.PI * 2);
    ctx.fill();
  }
}
function drawWaveform() {
  const wW = wCanvas.width, wH = 60;
  wCtx.clearRect(0, 0, wW, wH);
  let amplitude = 0;
  if (state === 'speaking')        amplitude = 12 + 16 * Math.abs(Math.sin(t * 4.3));
  else if (state === 'listening')  amplitude = 6  +  8 * Math.abs(Math.sin(t * 3.1));
  else if (state === 'processing') amplitude = 4  +  6 * Math.abs(Math.sin(t * 6));
  else if (state === 'alert')      amplitude = 18 * Math.abs(Math.sin(t * 7));
  else amplitude = 1 + Math.random() * 2;
  waveData.push(amplitude * (Math.random() > 0.5 ? 1 : -1));
  if (waveData.length > WAVE_LEN) waveData.shift();
  const s = STATES[state];
  const grad = wCtx.createLinearGradient(0, 0, wW, 0);
  grad.addColorStop(0, `rgba(${Math.round(s.r*255)},${Math.round(s.g*255)},${Math.round(s.b*255)},0.05)`);
  grad.addColorStop(0.5, `rgba(${Math.round(s.r*255)},${Math.round(s.g*255)},${Math.round(s.b*255)},0.8)`);
  grad.addColorStop(1, `rgba(${Math.round(s.r*255)},${Math.round(s.g*255)},${Math.round(s.b*255)},0.05)`);
  wCtx.strokeStyle = grad;
  wCtx.lineWidth = 1.5;
  wCtx.beginPath();
  const stepX = wW / WAVE_LEN;
  for (let i = 0; i < waveData.length; i++) {
    const x = i * stepX;
    const y = wH / 2 + waveData[i];
    i === 0 ? wCtx.moveTo(x, y) : wCtx.lineTo(x, y);
  }
  wCtx.stroke();
  wCtx.strokeStyle = `rgba(${Math.round(s.r*255)},${Math.round(s.g*255)},${Math.round(s.b*255)},0.1)`;
  wCtx.lineWidth = 0.5;
  wCtx.beginPath(); wCtx.moveTo(0, wH/2); wCtx.lineTo(wW, wH/2); wCtx.stroke();
}
function drawMain() {
  ctx.clearRect(0, 0, W, H);
  const s = STATES[state];
  const bgGrd = ctx.createRadialGradient(CX, CY, 0, CX, CY, 200);
  bgGrd.addColorStop(0, `rgba(${Math.round(s.r*255)},${Math.round(s.g*255)},${Math.round(s.b*255)},0.04)`);
  bgGrd.addColorStop(1, 'rgba(0,0,0,0)');
  ctx.fillStyle = bgGrd;
  ctx.fillRect(0, 0, W, H);
  drawHexGrid();
  drawCornerHUD();
  drawArcData();
  drawRing(140, 1.5, 0.4, 12, 24, 8,  0.45, false);
  drawRing(120, 1.0, 0.7,  8, 10, 16, 0.35, true);
  drawRing(102, 2.0, 1.0,  6,  6, 20, 0.5,  false);
  drawRing( 85, 0.8, 1.5,  4,  4, 28, 0.3,  true);
  drawScanLine();
  drawParticles();
  drawCore();
  if (Math.random() < 0.03) {
    document.getElementById('hud-r').textContent = 'PWR: ' + Math.floor(98 + Math.random() * 3) + '%';
  }
  t += 0.03;
}
function loop() {
  drawMain();
  drawWaveform();
  requestAnimationFrame(loop);
}
setState('idle');
loop();
</script>
</body>
</html>
```

Save as `jarvis_face.html` — remember **All Files** and `.html` extension in Notepad!
